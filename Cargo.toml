[workspace]
resolver = "3"
members = [
    "crates/winlane-cli",
    "crates/winlane-contracts",
    "crates/winlane-core",
    "crates/winlane-evidence",
    "crates/winlane-guest",
    "crates/winlane-ipc",
    "crates/winlane-mcp",
    "crates/winlane-provision",
    "crates/winlane-view",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/lainarchive/winlane"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
winlane-contracts = { path = "crates/winlane-contracts" }
winlane-core = { path = "crates/winlane-core" }
winlane-evidence = { path = "crates/winlane-evidence" }
winlane-ipc = { path = "crates/winlane-ipc" }
