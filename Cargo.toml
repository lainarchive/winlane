[workspace]
resolver = "3"
members = [
    "crates/winlane-cli",
    "crates/winlane-contracts",
    "crates/winlane-core",
    "crates/winlane-evidence",
    "crates/winlane-guest",
    "crates/winlane-ipc",
    "crates/winlane-mcp",
    "crates/winlane-provision",
    "crates/winlane-view",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/lainarchive/winlane"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winlane-contracts = { path = "crates/winlane-contracts" }
