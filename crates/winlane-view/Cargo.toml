[package]
name = "winlane-view"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winlane-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
png.workspace = true
base64.workspace = true
fast_image_resize.workspace = true

# sha2-asm does not support Windows targets; keep the upstream asm feature target-scoped.
[target.'cfg(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
